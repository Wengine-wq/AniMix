name: Build iOS Unsigned IPA (Clean Build)

on: [workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: animix-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-14
    env:
      # Public identifiers/endpoints, not secrets. Keeping production defaults
      # here prevents stale repository variables from silently reviving the
      # retired Cloudflare backend.
      SHIKIMORI_CLIENT_ID: NuL115GhQetODbWxWIKOKEt9E2IMtUqGkY9zdQacpBM
      SHIKIMORI_OAUTH_PROXY_URL: https://d5davburno8pol18q3hm.fovt0b64.apigw.yandexcloud.net
      ANIMIX_API_BASE_URL: https://d5davburno8pol18q3hm.fovt0b64.apigw.yandexcloud.net
    
    steps:
      - name: 📥 Скачивание кода проекта
        uses: actions/checkout@v4

      - name: 🐦 Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🧹 Очистка старых iOS-артефактов
        run: flutter clean

      - name: 📦 Установка зависимостей пакетов
        run: flutter pub get

      - name: 🔐 Подготовка публичной конфигурации
        run: echo "✅ Публичные адреса Yandex API заданы; OAuth secrets остаются в Lockbox"

      - name: ⚙️ Генерация файлов Xcode
        run: |
          flutter build ios --config-only --no-codesign \
            --dart-define=SHIKIMORI_CLIENT_ID="$SHIKIMORI_CLIENT_ID" \
            --dart-define=SHIKIMORI_OAUTH_PROXY_URL="$SHIKIMORI_OAUTH_PROXY_URL" \
            --dart-define=ANIMIX_API_BASE_URL="$ANIMIX_API_BASE_URL"

      - name: 🍏 Установка CocoaPods
        run: |
          cd ios
          pod install --repo-update --clean-install
          test -f Pods/Manifest.lock
          echo "✅ CocoaPods Manifest.lock создан"

      - name: 🔨 Прямая сборка через xcodebuild
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$(PWD)/../build/ios" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGNING_ALLOWED="NO" \
            DEVELOPMENT_TEAM="" \
            build

      - name: 📦 Упаковка в файл .ipa
        run: |
          cd build/ios/Release-iphoneos/
          mkdir -p Payload
          mv Runner.app Payload/
          zip -qq -r Animix.ipa Payload

      - name: 🚀 Загрузка готового файла
        uses: actions/upload-artifact@v4
        with:
          name: Animix_iOS_App
          path: build/ios/Release-iphoneos/Animix.ipa
          if-no-files-found: error
          retention-days: 7
