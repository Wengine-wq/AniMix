name: Build iOS Unsigned IPA (Clean Build)

on: [workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: 📥 Скачивание кода проекта
        uses: actions/checkout@v4

      - name: 🐦 Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🧹 Очистка старых iOS-артефактов
        run: flutter clean

      - name: 📦 Установка зависимостей пакетов
        run: flutter pub get

      - name: 🔐 Подготовка публичной конфигурации
        env:
          SHIKIMORI_CLIENT_ID: ${{ vars.SHIKIMORI_CLIENT_ID }}
          SHIKIMORI_REDIRECT_URI: ${{ vars.SHIKIMORI_REDIRECT_URI }}
          SHIKIMORI_OAUTH_PROXY_URL: ${{ vars.SHIKIMORI_OAUTH_PROXY_URL }}
        run: echo "✅ Используем GitHub Variables; OAuth secret в сборку не попадает"

      - name: ⚙️ Генерация файлов Xcode
        env:
          SHIKIMORI_CLIENT_ID: ${{ vars.SHIKIMORI_CLIENT_ID }}
          SHIKIMORI_REDIRECT_URI: ${{ vars.SHIKIMORI_REDIRECT_URI }}
          SHIKIMORI_OAUTH_PROXY_URL: ${{ vars.SHIKIMORI_OAUTH_PROXY_URL }}
        run: |
          flutter build ios --config-only --no-codesign \
            --dart-define=SHIKIMORI_CLIENT_ID="$SHIKIMORI_CLIENT_ID" \
            --dart-define=SHIKIMORI_REDIRECT_URI="${SHIKIMORI_REDIRECT_URI:-urn:ietf:wg:oauth:2.0:oob}" \
            --dart-define=SHIKIMORI_OAUTH_PROXY_URL="$SHIKIMORI_OAUTH_PROXY_URL"

      - name: 🍏 Установка CocoaPods
        run: |
          cd ios
          pod install --repo-update --clean-install
          test -f Pods/Manifest.lock
          echo "✅ CocoaPods Manifest.lock создан"

      - name: 🔨 Прямая сборка через xcodebuild
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$(PWD)/../build/ios" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGNING_ALLOWED="NO" \
            DEVELOPMENT_TEAM="" \
            build

      - name: 📦 Упаковка в файл .ipa
        run: |
          cd build/ios/Release-iphoneos/
          mkdir -p Payload
          mv Runner.app Payload/
          zip -qq -r Animix.ipa Payload

      - name: 🚀 Загрузка готового файла
        uses: actions/upload-artifact@v4
        with:
          name: Animix_iOS_App
          path: build/ios/Release-iphoneos/Animix.ipa
          retention-days: 7
